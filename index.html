<!DOCTYPE html>
<html lang="es-CL">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Mipega.cl: calculadoras laborales de Chile (liquidación, finiquito, vacaciones, horas extras y licencias médicas). App independiente; NO representa al Gobierno de Chile ni a ningún organismo público.">
  <meta name="theme-color" content="#0B3D44">
  <meta name="color-scheme" content="light">
  <meta name="format-detection" content="telephone=no">

  <!-- iPhone: Agregar a pantalla de inicio. Todo corre en el navegador; no se envían datos. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mipega.cl">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mipega.cl</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: #0B3D44;
      overflow: hidden;
      overscroll-behavior: none;
      position: fixed;
      inset: 0;
    }
    #cargando {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0B3D44;
      color: #FBF7EF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      z-index: 1;
      text-align: center;
      padding: 24px;
    }
    #cargando strong {
      font-size: 32px;
      letter-spacing: -0.4px;
      font-weight: 800;
    }
    #cargando p {
      margin: 10px 0 0;
      font-size: 14px;
      color: #FBF7EF;
    }
    body:has(flt-glass-pane) #cargando {
      display: none;
    }
  </style>
</head>
<body>
  <div id="cargando" role="status">
    <strong>
      <span style="color:#FAF7F0">Mipega</span><span style="color:#4678E6">.</span><span style="color:#FFFFFF">c</span><span style="color:#EB3C2D">l</span>
    </strong>
    <p>Cargando calculadoras…</p>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var nodo = document.getElementById('cargando');
      if (nodo) nodo.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
  <script data-goatcounter="https://mipega.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
